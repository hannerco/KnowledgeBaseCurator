services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://backend:8000/api/v1
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: ./backend/src
    ports:
      - "8000:8000"
    volumes:
      - ./backend/src:/app
      - ./backend/scripts:/app/scripts
      - ./backend/data:/app/data
    env_file:
      - ./backend/.env
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
    depends_on:
      chromadb:
        condition: service_healthy
      db:
        condition: service_started
      langfuse-server:
        condition: service_started
  chromadb:
    image: chromadb/chroma:0.5.23
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  langfuse-db:
      image: postgres:15
      restart: always
      environment:
        POSTGRES_USER: langfuse
        POSTGRES_PASSWORD: langfuse
        POSTGRES_DB: langfuse
      volumes:
        - langfuse_postgres:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U langfuse"]
        interval: 10s
        timeout: 5s
        retries: 5

  langfuse-server:
      image: langfuse/langfuse:2
      ports:
        - "3001:3000"
      depends_on:
        langfuse-db:
          condition: service_healthy
      environment:
        DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
        NEXTAUTH_SECRET: changeme_use_a_long_random_secret_here
        SALT: changeme_use_a_random_salt_here
        NEXTAUTH_URL: http://localhost:3001
        TELEMETRY_ENABLED: "false"
      restart: unless-stopped

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data



volumes:
  chroma_data:
  postgres_data:
  langfuse_postgres:
